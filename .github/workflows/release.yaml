name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Build with PyInstaller
        run: uv run PyInstaller prospero.spec --clean --noconfirm

      - name: Build the stable Windows launcher
        working-directory: launcher
        run: cargo build --release --locked

      - name: Stage the launcher
        shell: bash
        run: cp launcher/target/release/prospero-launcher.exe dist/ProsperoLauncher.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss

      - name: Locate installer output
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          installer="dist/ProsperoSetup-${{ steps.version.outputs.version }}.exe"
          if [[ ! -f "$installer" ]]; then
            echo "Expected installer was not built: $installer" >&2
            echo "Contents of dist:" >&2
            ls -la dist >&2
            exit 1
          fi
          echo "path=$installer" >> "$GITHUB_OUTPUT"

      - name: Package the Windows update archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run python - <<'PY'
          import os
          import tarfile

          version = os.environ["VERSION"]
          archive = f"Prospero-{version}-windows-x86_64.tar.xz"
          with tarfile.open(archive, "w:xz", preset=6) as output:
              output.add("dist/Prospero", arcname="Prospero")
          PY

      - name: Stage Windows release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-windows
          cp "${{ steps.installer.outputs.path }}" release-windows/
          cp "Prospero-${VERSION}-windows-x86_64.tar.xz" release-windows/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prospero-windows
          path: release-windows/*
          if-no-files-found: error
          compression-level: 9

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Build with PyInstaller
        run: uv run pyinstaller prospero.spec --clean --noconfirm

      - name: Check the Linux installer scripts
        run: |
          bash -n packaging/linux/install.sh
          bash -n packaging/linux/uninstall.sh

      - name: Package tarball
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          package_root="Prospero-${VERSION}"
          package_dir="dist/$package_root"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"

          cp -a dist/Prospero "$package_dir/"
          cp packaging/linux/install.sh "$package_dir/install.sh"
          cp packaging/linux/uninstall.sh "$package_dir/uninstall.sh"
          cp packaging/linux/prospero.desktop "$package_dir/prospero.desktop"
          printf '%s\n' "${VERSION}" > "$package_dir/VERSION"

          XZ_OPT='-6 -T0' tar -cJf "Prospero-${VERSION}-linux-x86_64.tar.xz" \
            -C dist "$package_root"
          tar -tJf "Prospero-${VERSION}-linux-x86_64.tar.xz" | \
            grep -qx "$package_root/uninstall.sh"

      - name: Stage Linux release asset
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-linux
          cp "Prospero-${VERSION}-linux-x86_64.tar.xz" release-linux/

      - name: Upload tarball
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prospero-linux
          path: release-linux/*
          if-no-files-found: error
          compression-level: 9

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: prospero-*
          merge-multiple: true

      - name: List files to release
        run: ls -l dist

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            'dist/ProsperoSetup-*.exe' \
            'dist/Prospero-*-windows-x86_64.tar.xz' \
            'dist/Prospero-*-linux-x86_64.tar.xz'
          do
            if ! compgen -G "$pattern" > /dev/null; then
              echo "Missing expected release asset: $pattern" >&2
              exit 1
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Prospero ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
