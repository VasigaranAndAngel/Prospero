name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Build with PyInstaller
        run: uv run PyInstaller prospero.spec --clean --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss

      - name: Locate installer output
        id: installer
        shell: bash
        run: |
          FILE=$(find dist -maxdepth 1 -name "*Setup*.exe" | head -n 1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prospero-windows
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Build with PyInstaller
        run: uv run PyInstaller prospero.spec --clean --noconfirm

      - name: Package tarball
        run: |
          cp packaging/linux/install.sh dist/install.sh
          cp packaging/linux/prospero.desktop dist/prospero.desktop
          tar -czf "Prospero-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" \
            -C dist Prospero install.sh prospero.desktop

      - name: Upload tarball
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prospero-linux
          path: Prospero-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7.0.1
        with:
          path: dist
          pattern: prospero-*
          merge-multiple: true

      - name: List files to release
        run: ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Prospero ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*
