[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "Prospero"
description = ""
dynamic = ["version"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "packaging>=26.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pynput>=1.8.2",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "pywin32>=312",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.22.2",
]
cli = [
    "pyperclip>=1.11.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyside-widget-reloader>=0.0.3",
    "pytest>=9.1.1",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_version.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["-s"]

[tool.ruff]
select = ["I"]
line-length = 100

[tool.pyrefly]
# Python version/platform
python-version = "3.13"
python-platform = "all"

# Behave more like a strict checker
check-unannotated-defs = true
infer-return-types = "checked"

# More strict callable compatibility
strict-callable-subtyping = true

# Respect existing pyright ignores
permissive-ignores = true

project-includes = [
    "src",
    "tests",
]

project-excludes = [
    "**/__pycache__",
    "**/.venv",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/build",
    "**/dist",
]
